<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
<style>
section{
    	background-color: #fcfcfc;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }    
    h1,p{
    	text-align: center;
    }
    body{
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    input[type="text"], select, textarea, button {
    	width: 94%;
    	padding: 15px;
    	border: 1px solid #ccc;
    	border-radius: 5px;
    	text-align: center;
    }
    input[type="placeholder"]{
          text-align: center;
    }
    input[type="submit"]{cursor:pointer ;width: 100%;}
   
  h1 {
    background-color: rgb(88, 191, 255);
    color: white;
  }
  
</style>

</head>
<body>
 <header>     
    <h1>RATE A MOVIE</h1>
    <p>Say something about the movie youre gonna rate.</p>
 </header>
 
 <br>   

 <section>
 <form>
         <img style="display: block; height: 150px; width: 150px; margin: 0 auto; " src="https://media.istockphoto.com/id/1482083787/vector/movie-clapper-board-film-slate-with-play-button-vector.jpg?s=612x612&w=0&k=20&c=xg3ooW7HQumCwqDQwaUF8o86F8iz9srXCG_QEL3jRvI=" alt="logo">
        <br>
        <label for=""> Movie Title </label>   
        <br>
        <input type="text" id="Movie" name="Movie" placeholder="Type here...">
        <br>

        <label for="genre">Genre/s</label>
        <br>
        <input type="checkbox" id="genre1" name="genre1">
         <label for="genre1"> Action </label>
         <input type="checkbox" id="genre2" name="genre2">
         <label for="genre2"> Drama </label>
         <input type="checkbox" id="genre3" name="genre3">
         <label for="genre3"> Comedy </label>
         <input type="checkbox" id="genre4" name="genre4">
         <label for="genre4"> Horror </label>
         <input type="checkbox" id="genre5" name="genre5">
         <label for="genre5"> Science Fiction </label>
        
         <br>

         <label for="rate">Rating</label>
        <br>
        <input type="radio" id="rate1" name="rate1">
              <label for="rate">⭐</label>
              <input type="radio" id="rate2" name="rate2">
              <label for="rate">⭐⭐</label>
              <input type="radio" id="rate3" name="rate"3>
              <label for="rate">⭐⭐⭐</label>
              <input type="radio" id="rate4" name="rate4">
              <label for="rate">⭐⭐⭐⭐</label>
              <input type="radio" id="rate5" name="rate5">
              <label for="rate">⭐⭐⭐⭐⭐</label>


        <br>
        <textarea id="review" placeholder="Write a Review" rows="4" cols="40"></textarea>
        
        <br>
        <input type="submit" id="submit" value="Submit Review">

        <br>
        
 </section>
    </form>

             
        
   
</body>
</html>
